<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SmartList – Opening App…</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      const params = new URLSearchParams(window.location.search);
      const listId = params.get('listId');
      const inviter = params.get('inviter');

      const appLink =
        'smartlist://home' +
        (listId ? `?listId=${encodeURIComponent(listId)}` : '') +
        (inviter ? `&inviter=${encodeURIComponent(inviter)}` : '');

      const iosStore = 'https://apps.apple.com/app/idYOUR_APP_ID';
      const androidStore = 'https://play.google.com/store/apps/details?id=com.achiya.shoppingList';

      const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
      const isAndroid = /Android/i.test(navigator.userAgent);

      // Try opening app
      window.location.href = appLink;

      // Fallback to store
      setTimeout(() => {
        if (isIOS) window.location.href = iosStore;
        else if (isAndroid) window.location.href = androidStore;
      }, 1200);
    </script>

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #2d3748;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }

      .card {
        background: #fff;
        border-radius: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
        padding: 48px 40px 36px;
        max-width: 420px;
        width: 100%;
      }

      .logo {
        font-size: 3rem;
        margin-bottom: 12px;
      }

      h1 {
        font-size: 1.8rem;
        font-weight: 700;
        color: #2d3748;
        margin-bottom: 8px;
      }

      .subtitle {
        font-size: 1rem;
        color: #718096;
        margin-bottom: 24px;
      }

      .spinner {
        width: 36px;
        height: 36px;
        border: 4px solid #e2e8f0;
        border-top-color: #667eea;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 20px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .redirect-msg {
        font-size: 0.9rem;
        color: #a0aec0;
      }

      .links {
        margin-top: 28px;
        padding-top: 20px;
        border-top: 1px solid #edf2f7;
        display: flex;
        justify-content: center;
        gap: 24px;
        flex-wrap: wrap;
      }

      .links a {
        color: #667eea;
        text-decoration: none;
        font-size: 0.88rem;
        font-weight: 500;
      }

      .links a:hover {
        text-decoration: underline;
      }

      @media (max-width: 480px) {
        .card {
          padding: 36px 24px 28px;
        }
        h1 {
          font-size: 1.5rem;
        }
      }
    </style>
  </head>

  <body>
    <div class="card">
      <div class="logo">🛒</div>
      <h1>SmartList</h1>
      <p class="subtitle">Opening the app…</p>
      <div class="spinner"></div>
      <p class="redirect-msg">If nothing happens, you'll be redirected to the app store.</p>

      <div class="links">
        <a href="https://smartlist.website/privacy-policy.html">Privacy Policy</a>
        <a href="mailto:achiyabennatan@gmail.com">Contact Us</a>
      </div>
    </div>
  </body>
</html>
